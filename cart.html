<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dudeshape</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="#home">
        <span class="brand-name">Dudeshape</span>
      </a>
      <nav class="main-nav" id="mainNav" aria-label="Главная навигация">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#products">Products</a></li>
          <li><a href="#services">About us</a></li>
          <li><a href="#contact">Contact us</a></li>
        </ul>
      </nav>
        <button class="btn btn-ghost" id="loginBtn">Login</button>
        <span class="user-name" id="userNameLabel" hidden></span>

        <div class="avatar" title="Профиль" tabindex="0" id="avatarBtn" aria-haspopup="true" aria-expanded="false">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><circle cx='16' cy='12' r='6' fill='%23e0e0e0'/><rect y='20' width='32' height='10' rx='3' fill='%23e0e0e0'/></svg>" alt="Аватар">
          <div class="avatar-menu" id="avatarMenu" role="menu" aria-hidden="true">
            <a href="#profile" role="menuitem">Profile</a>
            <a href="#settings" role="menuitem">Settings</a>
            <button type="button" role="menuitem" id="logoutBtn">Logout</button>
          </div>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Открыть меню" aria-controls="mainNav" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
